version: 2

# One batched PR per ecosystem per month, rather than a PR per dependency
# or per ecosystem group. Majors are split into their own PR so a breaking
# upgrade never blocks a batch of routine patches.
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
      commit-message:
          prefix: "chore(deps)"
          prefix-development: "chore(deps-dev)"
      groups:
          dependencies:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
          major-updates:
              patterns:
                  - "*"
              update-types:
                  - "major"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
      commit-message:
          prefix: "chore(ci)"
      groups:
          github-actions:
              patterns:
                  - "*"
