version: 2

# One batched PR per ecosystem per month, rather than a PR per dependency
# or per ecosystem group. Majors are split into their own PR so a breaking
# upgrade never blocks a batch of routine patches.
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
      commit-message:
          prefix: "chore(deps)"
          prefix-development: "chore(deps-dev)"
      ignore:
          # typescript-eslint declares `typescript: ">=4.8.4 <6.1.0"`, and
          # that is still true of 8.65.0, the current latest — there is no
          # release to upgrade to. Installing TypeScript 7 crashes
          # `eslint .` outright:
          #
          #   TypeError: Cannot read properties of undefined (reading 'Cjs')
          #     at @typescript-eslint/typescript-estree/.../shared.js
          #
          # Minors are held for the same reason: the peer range excludes
          # 6.1.0, so TypeScript 6.1 would break lint just as 7 does.
          # Patches (6.0.x) still come through.
          #
          # Drop this block once typescript-eslint widens the range.
          - dependency-name: "typescript"
            update-types:
                - "version-update:semver-major"
                - "version-update:semver-minor"
      groups:
          dependencies:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
          major-updates:
              patterns:
                  - "*"
              update-types:
                  - "major"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
      commit-message:
          prefix: "chore(ci)"
      groups:
          github-actions:
              patterns:
                  - "*"
