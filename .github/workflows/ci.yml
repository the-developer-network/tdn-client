name: CI

on:
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    lint-and-typecheck:
        name: Lint & Typecheck
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm exec tsc -b

    unit-tests:
        name: Unit & Integration Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Run tests
              run: pnpm test

    e2e:
        name: E2E Tests (Playwright)
        runs-on: ubuntu-latest
        needs: [lint-and-typecheck]

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Run E2E tests
              run: pnpm test:e2e

            # `wrangler dev` runs as a Playwright webServer, so all a failing run
            # shows is `[WebServer] ✘ [ERROR]` with the detail in a file on the
            # runner. Without this the only symptom is ECONNREFUSED on 8788.
            - name: Wrangler logs
              if: failure()
              run: |
                  shopt -s nullglob
                  for log in ~/.config/.wrangler/logs/*.log; do
                      echo "===== $log ====="
                      cat "$log"
                  done
