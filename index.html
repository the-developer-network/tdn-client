<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!--
            Stamp the theme onto <html> before the first paint.

            Zustand's `persist` cannot do this: it reads localStorage when the
            store module evaluates, which is after the bundle has downloaded and
            React has mounted. The stylesheet's default is dark, so until then a
            reader who chose light gets a black page — a flash on every cold
            load, on the one setting they picked to avoid it.

            The resolution is duplicated from `resolveTheme` in
            `src/shared/store/theme.store.ts` rather than imported, because an
            import here is a module round trip and the point is to run before
            one. It is four lines, and it defaults to dark exactly as the store
            does, so a broken or absent key lands where the store will too.
        -->
        <script>
            (function () {
                var theme = "dark";
                try {
                    var stored = localStorage.getItem("tdn-theme");
                    var saved = stored && JSON.parse(stored).state.theme;
                    if (saved === "light" || saved === "dark") {
                        theme = saved;
                    } else if (saved === "system") {
                        theme = window.matchMedia(
                            "(prefers-color-scheme: dark)",
                        ).matches
                            ? "dark"
                            : "light";
                    }
                } catch (e) {
                    /* Private mode, blocked storage, a half-written key — dark. */
                }
                document.documentElement.dataset.theme = theme;
            })();
        </script>

        <!--
            Search Console ownership. The equivalent of the googleXXXX.html file
            Google offers first, and preferred here because it lives with the
            shell rather than as a loose file in `public/` whose purpose is not
            obvious from its name.

            Verification is re-checked periodically, not once: removing this
            un-verifies the property and silently drops the sitemap reporting
            with it. It survives the Worker's meta rewrite because that only
            strips `og:`, `twitter:` and `description` — see the test in
            `worker/index.test.ts` holding that down.
        -->
        <meta
            name="google-site-verification"
            content="UZeGKB2iQEwOfEpmzsT7nPypL0QRHD7S5uD-dUKU0CQ"
        />

        <title>TDN - The Developer Network</title>

        <!-- Default SEO meta (overridden per-page by react-helmet-async + CF edge function) -->
        <meta
            name="description"
            content="TDN is the social network for developers. Share code, tech news, articles and connect with the dev community."
        />

        <!-- Open Graph defaults -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="TDN - The Developer Network" />
        <meta property="og:title" content="TDN - The Developer Network" />
        <meta
            property="og:description"
            content="TDN is the social network for developers. Share code, tech news, articles and connect with the dev community."
        />
        <meta
            property="og:image"
            content="https://developernetwork.net/og-default.png"
        />
        <meta property="og:url" content="https://developernetwork.net" />

        <!-- Twitter Card defaults -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="TDN - The Developer Network" />
        <meta
            name="twitter:description"
            content="TDN is the social network for developers. Share code, tech news, articles and connect with the dev community."
        />
        <meta
            name="twitter:image"
            content="https://developernetwork.net/og-default.png"
        />

        <!-- JSON-LD: WebSite schema (enables Google Sitelinks search box) -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "TDN - The Developer Network",
                "url": "https://developernetwork.net",
                "description": "TDN is the social network for developers. Share code, tech news, articles and connect with the dev community.",
                "potentialAction": {
                    "@type": "SearchAction",
                    "target": {
                        "@type": "EntryPoint",
                        "urlTemplate": "https://developernetwork.net/explore?q={search_term_string}"
                    },
                    "query-input": "required name=search_term_string"
                }
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
